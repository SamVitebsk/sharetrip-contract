openapi: 3.0.3
info:
  title: ShareTrip Contract Service API
  version: 0.1.0
  description: API сервиса договорных условий и проверки доступности услуг для компаний.
servers:
  - url: /
    description: Service base URL
security: []
tags:
  - name: Contracts
    description: Договоры компаний и проверка доступности услуг.
paths:
  /contracts:
    $ref: "./paths/create_contract.yaml"
  /contracts/{contractId}:
    $ref: "./paths/get_contract.yaml"
  /companies/{companyId}/active-contract:
    $ref: "./paths/get_company_active_contract.yaml"
  /contracts/{contractId}/sign:
    $ref: "./paths/sign_contract.yaml"
  /contracts/{contractId}/suspend:
    $ref: "./paths/suspend_contract.yaml"
  /contracts/{contractId}/resume:
    $ref: "./paths/resume_contract.yaml"
  /contracts/{contractId}/terminate:
    $ref: "./paths/terminate_contract.yaml"
  /companies/{companyId}/services/{serviceCode}/availability-check:
    $ref: "./paths/check_service_availability.yaml"
components:
  parameters:
    ContractId:
      name: contractId
      in: path
      required: true
      description: Идентификатор договора.
      schema:
        type: string
        format: uuid
    CompanyId:
      name: companyId
      in: path
      required: true
      description: Идентификатор компании.
      schema:
        type: string
        format: uuid
    ServiceCode:
      name: serviceCode
      in: path
      required: true
      description: Код проверяемой услуги.
      schema:
        $ref: "#/components/schemas/ServiceCode"
  schemas:
    Contract:
      type: object
      required:
        - id
        - companyId
        - status
        - validFrom
        - services
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор договора.
        companyId:
          type: string
          format: uuid
          description: Идентификатор компании.
        status:
          $ref: "#/components/schemas/ContractStatus"
        validFrom:
          type: string
          format: date-time
          description: Дата начала действия договора.
        validUntil:
          type: string
          format: date-time
          nullable: true
          description: Дата окончания действия договора. Если не указана, договор бессрочный.
        services:
          type: array
          description: Услуги, указанные в договоре.
          items:
            $ref: "#/components/schemas/ContractService"
        createdAt:
          type: string
          format: date-time
          description: Дата создания договора.
        updatedAt:
          type: string
          format: date-time
          description: Дата последнего обновления договора.
      additionalProperties: false
    ContractStatus:
      type: string
      description: Статус договора.
      enum:
        - draft
        - active
        - suspended
        - terminated
    ServiceCode:
      type: string
      description: Код услуги, доступность которой регулируется договором.
      enum:
        - tripCreation
        - tripParticipants
        - notifications
    ContractService:
      type: object
      required:
        - serviceCode
        - allowed
      properties:
        serviceCode:
          $ref: "#/components/schemas/ServiceCode"
        allowed:
          type: boolean
          description: Разрешена ли услуга по договору.
      additionalProperties: false
    CreateContractRequest:
      type: object
      required:
        - companyId
        - validFrom
        - services
      properties:
        companyId:
          type: string
          format: uuid
          description: Компания, для которой создаётся договор.
        validFrom:
          type: string
          format: date-time
          description: Дата начала действия договора.
        validUntil:
          type: string
          format: date-time
          nullable: true
          description: Дата окончания действия договора. Если не указана, договор бессрочный.
        services:
          type: array
          minItems: 1
          description: Услуги, включённые в договор.
          items:
            $ref: "#/components/schemas/ContractService"
      additionalProperties: false
    CreateContractResponse:
      type: object
      required:
        - contract
      properties:
        contract:
          $ref: "#/components/schemas/Contract"
      additionalProperties: false
    SignContractResponse:
      type: object
      required:
        - contract
      properties:
        contract:
          $ref: "#/components/schemas/Contract"
      additionalProperties: false
    CheckServiceAvailabilityResponse:
      type: object
      required:
        - allowed
      properties:
        allowed:
          type: boolean
          description: Доступна ли услуга компании.
        reason:
          type: string
          nullable: true
          description: Причина отказа, если услуга недоступна.
          enum:
            - activeContractNotFound
            - contractNotStarted
            - contractExpired
            - contractSuspended
            - contractTerminated
            - serviceNotInContract
            - serviceDisabled
        contractId:
          type: string
          format: uuid
          nullable: true
          description: Договор, на основании которого принято решение.
      additionalProperties: false
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки.
        message:
          type: string
          description: Человекочитаемое описание ошибки.
      additionalProperties: false
