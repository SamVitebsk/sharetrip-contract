get:
  tags:
    - Contracts
  operationId: getClientActiveContract
  summary: Получить активный договор клиента
  description: Возвращает активный договор клиента, если он существует.
  parameters:
    - $ref: "../contract.yaml#/components/parameters/ClientId"
  responses:
    "200":
      description: Активный договор найден.
      content:
        application/json:
          schema:
            $ref: "../contract.yaml#/components/schemas/Contract"
    "404":
      description: Активный договор клиента не найден.
      content:
        application/json:
          schema:
            $ref: "../contract.yaml#/components/schemas/ErrorResponse"
    "501":
      description: Операция пока не реализована.
      content:
        application/json:
          schema:
            $ref: "../contract.yaml#/components/schemas/ErrorResponse"
