post:
  tags:
    - Contracts
  operationId: resumeContract
  summary: Возобновить договор
  description: Переводит приостановленный договор обратно в статус `active`.
  parameters:
    - $ref: "../contract.yaml#/components/parameters/ContractId"
  responses:
    "200":
      description: Договор возобновлён.
      content:
        application/json:
          schema:
            $ref: "../contract.yaml#/components/schemas/Contract"
    "404":
      description: Договор не найден.
      content:
        application/json:
          schema:
            $ref: "../contract.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Договор нельзя возобновить в текущем состоянии.
      content:
        application/json:
          schema:
            $ref: "../contract.yaml#/components/schemas/ErrorResponse"
    "501":
      description: Операция пока не реализована.
      content:
        application/json:
          schema:
            $ref: "../contract.yaml#/components/schemas/ErrorResponse"
