post:
  tags:
    - Contracts
  operationId: terminateContract
  summary: Расторгнуть договор
  description: Переводит договор в финальный статус `terminated`.
  parameters:
    - $ref: "../contract.yaml#/components/parameters/ContractId"
  responses:
    "200":
      description: Договор расторгнут.
      content:
        application/json:
          schema:
            $ref: "../contract.yaml#/components/schemas/Contract"
    "404":
      description: Договор не найден.
      content:
        application/json:
          schema:
            $ref: "../contract.yaml#/components/schemas/ErrorResponse"
    "409":
      description: Договор нельзя расторгнуть в текущем состоянии.
      content:
        application/json:
          schema:
            $ref: "../contract.yaml#/components/schemas/ErrorResponse"
    "501":
      description: Операция пока не реализована.
      content:
        application/json:
          schema:
            $ref: "../contract.yaml#/components/schemas/ErrorResponse"
