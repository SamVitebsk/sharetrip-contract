post:
  tags:
    - Contracts
  operationId: checkServiceAvailability
  summary: Проверить доступность услуги для клиента
  description: Возвращает бизнес-решение, может ли клиент использовать указанную услугу.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../contract.yaml#/components/schemas/CheckServiceAvailabilityRequest"
  responses:
    "200":
      description: Решение о доступности услуги принято.
      content:
        application/json:
          schema:
            $ref: "../contract.yaml#/components/schemas/CheckServiceAvailabilityResponse"
    "400":
      description: Некорректный код услуги или идентификатор клиента.
      content:
        application/json:
          schema:
            $ref: "../contract.yaml#/components/schemas/ErrorResponse"
    "501":
      description: Операция пока не реализована.
      content:
        application/json:
          schema:
            $ref: "../contract.yaml#/components/schemas/ErrorResponse"
